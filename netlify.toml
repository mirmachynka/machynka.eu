[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.3.14"

[[redirects]]
from = "https://penzion.machynka.cz/*"
to = "https://machynka.eu/:splat"
status = 301
force = true

[[redirects]]
from = "https://machynka.cz/*"
to = "https://machynka.eu/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.machynka.cz/*"
to = "https://machynka.eu/:splat"
status = 301
force = true
